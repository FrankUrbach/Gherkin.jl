name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.9"
          - "1"        # latest stable
          - "nightly"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        exclude:
          # Reduce CI load: nightly only on Linux
          - os: macos-latest
            julia-version: nightly
          - os: windows-latest
            julia-version: nightly

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
